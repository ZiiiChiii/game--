<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>多邊形魔法學院・象數試煉</title>
<style>
:root{--ink:#2b1d4a;--bg:#fdfbff;--panel:#ffffff;--line:#e4dbf5;--violet:#7a5cd6;--violetD:#5b3fa0;--gold:#d9a13a;--goldL:#f3d27a;--mint:#3fb596;--mintD:#2a8a72;--dim:#6e6190;--soft:#f5f1ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:linear-gradient(#fdfbff,#f3edff);color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;min-height:100vh}
header{max-width:1000px;margin:auto;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.brand{font-weight:900;font-size:19px;letter-spacing:3px;color:var(--violetD)}
.chip{font-size:12px;letter-spacing:1px;color:var(--dim);padding:6px 12px;background:var(--panel);box-shadow:0 0 0 2px var(--line)}
.wrap{display:grid;grid-template-columns:auto 290px;gap:22px;max-width:1060px;margin:22px auto;padding:0 16px;justify-content:center}
.stage{min-width:0}
canvas#cv{display:block;max-width:100%;height:auto;image-rendering:pixelated;border:3px solid var(--gold);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--line),0 10px 30px rgba(122,92,214,.15);background:#fff}
.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
#place{font-size:14px;color:var(--violetD);font-weight:700;letter-spacing:1px}
#student{background:var(--panel);color:var(--ink);border:0;padding:8px 10px;font:inherit;width:230px;box-shadow:inset 0 0 0 2px var(--line)}
#msg{min-height:30px;margin:12px 0 4px;color:#9a6a10;opacity:0;transition:opacity .25s;line-height:1.6;font-size:15px;font-weight:700}
#msg.show{opacity:1}
.pad{display:grid;justify-items:center;gap:6px;margin-top:8px}.pad .r{display:flex;gap:6px}
.pad button{width:60px;height:50px;color:var(--violetD);background:#fff;border:0;font-size:20px;cursor:pointer;box-shadow:inset -3px -3px 0 #e4dbf5,inset 3px 3px 0 #fff,0 0 0 2px var(--line),0 0 0 3px var(--gold)}
.pad button:active{transform:translate(2px,2px)}
.side{background:var(--panel);padding:18px;align-self:start;box-shadow:0 0 0 2px var(--line),0 0 0 4px var(--gold),0 10px 30px rgba(122,92,214,.12)}
.stat{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:14px;color:var(--dim)}
.stat b{font-size:22px;color:var(--violetD);display:inline-flex;align-items:center;gap:6px}
.side h3{font-size:15px;color:var(--violetD);letter-spacing:2px;margin:16px 0 6px;border-bottom:2px solid var(--soft);padding-bottom:4px}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 0;font-size:13px}
.sq{width:12px;height:12px;display:inline-block;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
.sq.todo{background:var(--gold)}.sq.remain{background:#a98de8}.sq.ok{background:var(--mint)}
.spell{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;color:var(--dim)}
.spell.on{color:var(--ink)}
.spell b{color:var(--violetD)}
.btn{font:inherit;color:var(--violetD);background:#f2edff;border:0;padding:10px 14px;cursor:pointer;margin:6px 8px 6px 0;letter-spacing:1px;font-size:14px;box-shadow:inset -3px -3px 0 #ddd2f5,inset 3px 3px 0 #fff,0 0 0 2px var(--line)}
.btn:hover:not(:disabled){background:#e7dfff}
.btn:active:not(:disabled){transform:translate(2px,2px)}
.btn.primary{background:var(--violet);color:#fff;box-shadow:inset -3px -3px 0 var(--violetD),0 0 0 2px var(--line)}
.btn.primary:hover:not(:disabled){background:#6a4cc6}
.btn:disabled{opacity:.45;cursor:default}
.btn.sp{text-align:left;font-size:13px;padding:8px 12px}
.btn.sp small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.side .btn{display:block;width:100%;text-align:left;margin:8px 0}
.tiny{font-size:12px;color:var(--dim);line-height:1.7}
/* 標題畫面 */
#title{position:fixed;inset:0;z-index:20;background:linear-gradient(#fdfbff,#efe8ff);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;overflow:auto}
#tc{width:min(720px,100%);height:auto;image-rendering:pixelated;border:3px solid var(--gold);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--line),0 14px 40px rgba(122,92,214,.25)}
h1.logo{font-size:clamp(26px,5vw,42px);color:var(--violetD);text-shadow:3px 3px 0 var(--goldL);letter-spacing:5px;margin:18px 0 6px}
.sub{color:var(--dim);letter-spacing:5px;font-size:13px}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
/* 對話框與試煉場 */
.modal{position:fixed;inset:0;background:rgba(43,29,74,.35);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9;overflow:auto}
.box{background:var(--panel);max-width:700px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 0 0 2px var(--line),0 0 0 4px var(--gold),0 20px 60px rgba(122,92,214,.35)}
.qtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
canvas.pt{width:96px;height:96px;image-rendering:pixelated;background:var(--soft);box-shadow:0 0 0 3px var(--gold),0 0 0 5px #fff;flex-shrink:0}
.tag{display:inline-block;background:var(--soft);color:var(--violetD);padding:4px 10px;font-size:12px;letter-spacing:2px;box-shadow:0 0 0 2px var(--line)}
.tname{color:var(--violetD);font-weight:800;font-size:16px;margin:8px 0 4px}
.mage{font-size:13px;color:var(--dim)}
.bars{display:flex;flex-direction:column;gap:4px;margin-right:4px}
.bars span{display:block;width:34px;height:4px;background:var(--gold)}
.bars span.n{background:linear-gradient(90deg,var(--gold) 0 40%,transparent 40% 60%,var(--gold) 60%)}
h2{font-size:21px;line-height:1.6;margin:12px 0}h3{font-size:16px;margin:16px 0 6px;color:var(--violetD)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.spellbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.badge{background:var(--soft);color:var(--violetD);padding:5px 10px;font-size:13px}
.hint{background:#eefaf5;padding:12px 14px;margin:12px 0;line-height:1.8;font-size:14px;box-shadow:inset 0 0 0 2px #bfe8d8}
.fig{background:#f5f1fc;padding:10px;margin:12px 0;text-align:center;box-shadow:0 0 0 2px var(--line)}.fig svg{max-height:160px;width:auto;max-width:100%}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;background:#faf8ff;border:0;color:var(--ink);padding:13px 14px;display:flex;gap:12px;align-items:center;font:inherit;font-size:15px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line)}
.opt:hover:not(:disabled){background:#f0eaff;box-shadow:inset 0 0 0 2px var(--violet)}
.opt:disabled{cursor:default}
.opt.gone{opacity:.35;text-decoration:line-through}
.opt.correct{background:#e4f6ef;box-shadow:inset 0 0 0 2px var(--mint)}
.opt.wrong{background:#fbe9e4;box-shadow:inset 0 0 0 2px #d07a62}
.lt{display:grid;place-content:center;width:26px;height:26px;background:var(--soft);color:var(--violetD);font-weight:900;flex-shrink:0;box-shadow:0 0 0 2px var(--line)}
.feedback{background:var(--soft);padding:14px 16px;margin:12px 0;line-height:1.8;font-size:15px}
.feedback.ok{box-shadow:inset 4px 0 0 var(--mint)}.feedback.no{box-shadow:inset 4px 0 0 #d07a62}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}th,td{padding:8px;text-align:left;vertical-align:top;box-shadow:inset 0 0 0 1px var(--line)}th{background:var(--soft);color:var(--violetD)}
.sum h1{font-size:44px;margin:6px 0;color:var(--violetD)}
.sum h1 small{font-size:18px;color:var(--dim)}
.btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
textarea{width:100%;min-height:80px;background:var(--soft);color:var(--ink);border:0;padding:10px;font:inherit;box-shadow:inset 0 0 0 2px var(--line)}
.rank{font-size:12px;letter-spacing:1px;color:var(--violetD)}
#mc{display:block;width:100%;max-width:480px;height:auto;margin:10px auto 0;image-rendering:pixelated;border:3px solid var(--gold);background:#fbf9ff}
.mhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mctl-pad{display:flex;gap:8px;justify-content:center;margin-top:8px}
#mres{text-align:center;margin-top:10px}
#mres .big{font-size:28px;font-weight:900;margin:4px 0}
#mres .big.ok{color:var(--mintD)}#mres .big.no{color:#b5523b}
.bcan{display:block;width:100%;max-width:480px;height:auto;margin:10px auto 0;border:3px solid var(--gold);background:#fbf9ff;touch-action:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chip2{padding:6px 12px;background:var(--soft);box-shadow:0 0 0 2px var(--line);font-weight:800;color:var(--violetD)}
.chip2.on{background:#e4f6ef;box-shadow:0 0 0 2px var(--mint);color:var(--mintD)}
.hp{height:12px;background:#f8e3e8;box-shadow:0 0 0 2px #ecbfca;margin:6px 0}
.hp span{display:block;height:100%;background:#d6566e;transition:width .5s}
.numin{font:inherit;font-size:20px;width:110px;padding:8px 10px;border:0;box-shadow:inset 0 0 0 2px var(--violet);background:#fff;color:var(--ink);text-align:center}
.bigres{font-size:28px;font-weight:900;margin:8px 0 4px;text-align:center}
.bigres.ok{color:var(--mintD)}.bigres.no{color:#b5523b}
.center{text-align:center}
@media(max-width:820px){.wrap{grid-template-columns:1fr}#student{width:100%}}
</style></head><body>

<div id="title">
  <canvas id="tc" width="720" height="400"></canvas>
  <h1 class="logo">多邊形魔法學院</h1>
  <div class="sub">象 · 數 · 魔　五座塔・五位法師</div>
  <div style="margin-top:18px"><button class="btn primary" id="btnStart" onclick="startGame()">開始冒險</button></div>
  <p class="tiny blink" style="margin-top:14px">按下開始，走進你的第一座塔</p>
</div>

<header><div class="brand">✦ 多邊形魔法學院</div><div class="chip">象・數・魔 ｜ 五年級數學 5-1 多邊形</div></header>

<main class="wrap">
  <section class="stage">
    <div class="topbar">
      <div id="place"></div>
      <input id="student" maxlength="20" placeholder="座號或暱稱（寫入匯出檔）">
    </div>
    <canvas id="cv" width="720" height="432"></canvas>
    <div id="msg"></div>
    <div class="pad">
      <button data-dx="0" data-dy="-1" aria-label="上">▲</button>
      <div class="r">
        <button data-dx="-1" data-dy="0" aria-label="左">◀</button>
        <button data-dx="0" data-dy="1" aria-label="下">▼</button>
        <button data-dx="1" data-dy="0" aria-label="右">▶</button>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="stat"><span>魔力</span><b id="score">0</b></div>
    <div class="stat"><span>法力 MP</span><b id="mp">0</b></div>
    <div class="stat"><span>魔法星晶</span><b id="stars">0</b></div>
    <div class="stat"><span>法師等級</span><span class="rank" id="rank"></span></div>
    <h3>五座塔</h3>
    <div id="towers"></div>
    <h3>魔法書</h3>
    <div id="spells"></div>
    <h3>紀錄</h3>
    <button class="btn" onclick="exportJSON()">匯出 JSON</button>
    <button class="btn" onclick="exportCSV()">匯出 CSV（Excel 可開）</button>
    <button class="btn" onclick="confirmReset()">重新開始本次試煉</button>
    <p class="tiny">操作：方向鍵或 WASD 移動，手機點下方方向鈕。走到塔門會進入該塔；走到祭壇（發光的圓）會開始守塔法師的試煉；走到紫色圓陣會進入試煉場。</p>
  </aside>
</main>

<div id="modal" class="modal" hidden><div class="box" id="box"></div></div>

<div id="mini" class="modal" hidden><div class="box">
  <div class="mhead"><span class="tag">試煉場</span><span id="mtitle" class="tname"></span></div>
  <p id="mrule" class="tiny"></p>
  <canvas id="mc" width="480" height="400"></canvas>
  <div class="row"><span id="mstat" class="tiny"></span></div>
  <div id="mctl">
    <div class="mctl-pad"><button class="btn" id="mleft">◀</button><button class="btn" id="mright">▶</button></div>
    <div id="mspells" class="spellbar"></div>
    <div class="row">
      <button class="btn primary" id="mstart" onclick="miniStart()">開始挑戰</button>
      <button class="btn" onclick="closeMini()">離開</button>
    </div>
  </div>
  <div id="mres" hidden></div>
</div></div>

<div id="boss1" class="modal" hidden><div class="box">
  <div class="mhead"><span class="tag">魔王房間</span><span class="tname">組裝之間・破形魔王</span></div>
  <p class="tiny">破形魔王把三角形打散了！拖曳 A、B、C 三個頂點，讓三條邊的長度符合目標。格線一格 = 1。</p>
  <div id="b1goal"></div>
  <div class="chips"><span class="tiny">目標邊長：</span><span id="b1chips" class="chips" style="margin:0"></span></div>
  <canvas id="b1c" class="bcan" width="480" height="400"></canvas>
  <div id="b1ctl" class="row"><button class="btn" onclick="b1Reset()">重新擺放</button><button class="btn" onclick="closeBoss1()">離開</button></div>
  <div id="b1res" class="center" hidden></div>
</div></div>

<div id="boss2" class="modal" hidden><div class="box">
  <div class="mhead"><span class="tag">魔王房間</span><span class="tname">角度之間・角度魔王</span></div>
  <div class="row" style="margin-top:4px"><span class="tiny">角度魔王 HP</span><span id="b2hearts" class="tiny"></span></div>
  <div class="hp"><span id="b2hp" style="width:100%"></span></div>
  <canvas id="b2c" class="bcan" width="480" height="400"></canvas>
  <div id="b2q"></div>
  <div id="b2spells" class="spellbar"></div>
  <div id="b2fb" aria-live="polite"></div>
  <div class="row" id="b2ctl"><span></span><button class="btn" onclick="closeBoss2()">離開</button></div>
</div></div>

<script>
// ===== 內容（題目、選項與正解與原版相同，只替換包裝）=====
const SHAPES={
 semi:'<svg viewBox="0 0 220 130"><path d="M20 115 A90 90 0 0 1 200 115 Z" fill="#d9d2ef" stroke="#5c4f8a" stroke-width="3"/></svg>',
 penta:'<svg viewBox="0 0 200 190"><polygon points="100,15 185,77 152,175 48,175 15,77" fill="#dff0d8" stroke="#3f7d4f" stroke-width="3"/></svg>',
 rhombus:'<svg viewBox="0 0 240 160"><polygon points="40,80 120,20 200,80 120,140" fill="#dcebf7" stroke="#3d6c97" stroke-width="3"/></svg>',
 hexa:'<svg viewBox="0 0 220 200"><polygon points="60,20 160,20 210,100 160,180 60,180 10,100" fill="#fde7c8" stroke="#a8692a" stroke-width="3"/></svg>'
};
const TOWERS=[
 {name:"多邊形的意義",mage:"線之法師",hint:"多邊形是由三條以上「直線邊」所圍成的平面圖形；有曲線的圖形不是多邊形。",qs:[
  ["多邊形是由什麼所圍成的平面圖形？",["三條以上的直線邊","兩條直線邊","一條曲線","任何線條都可以"],0],
  ["這個圖形是多邊形嗎？",["是，因為它有兩個角","不是，因為有一條邊是曲線","是，因為它是平面圖形","不是，因為它太小了"],1,"semi"],
  ["下列哪一個是多邊形？",["圓形","半圓形","正方形","月牙形"],2]]},
 {name:"名稱與邊角頂點",mage:"數之法師",hint:"多邊形依邊數命名；邊數、角數、頂點數三者一樣多。",qs:[
  ["這個圖形叫做什麼？",["四邊形","五邊形","六邊形","七邊形"],1,"penta"],
  ["六邊形有幾個頂點？",["4個","5個","6個","7個"],2,"hexa"],
  ["多邊形的邊數、角數和頂點數有什麼關係？",["三者一樣多","角數比邊數多1","頂點數比邊數少1","三者沒有關係"],0]]},
 {name:"正多邊形的條件",mage:"對稱之法師",hint:"每條邊都一樣長、每個角都一樣大，兩個條件同時成立才是正多邊形。",qs:[
  ["正多邊形必須符合哪兩個條件？",["每條邊都一樣長、每個角都一樣大","邊數是雙數、角數是雙數","至少有一個直角","看起來很整齊"],0],
  ["下列哪一個是正多邊形？",["長方形（長和寬不一樣長）","正方形","角不相等的菱形","邊長都不同的五邊形"],1],
  ["正六邊形有什麼特徵？",["6條邊一樣長，6個角也一樣大","6條邊一樣長就好","6個角一樣大就好","有6個直角"],0]]},
 {name:"判斷與反例",mage:"幻影法師",hint:"只看一個條件不夠：菱形邊一樣長但角不一定一樣大；長方形角一樣大但邊不一定一樣長。",qs:[
  ["這個菱形每條邊都一樣長，但角不一樣大。它是正多邊形嗎？",["是，因為邊一樣長","不是，因為角不一樣大","是，因為它有四條邊","它不是多邊形"],1,"rhombus"],
  ["每個角都一樣大的多邊形，每條邊一定一樣長嗎？",["一定","不一定，長方形就是例子","只有三角形不一定","一定，因為角決定邊長"],1],
  ["每條邊都一樣長的多邊形，每個角一定一樣大嗎？",["一定","不一定，菱形就是例子","只有四邊形一定","一定，因為邊決定角"],1]]},
 {name:"證據與AI學習",mage:"證據之法師",hint:"判斷要有證據：用直尺、量角器、課本或影片核對；向AI提問要先有初稿，找不到依據就標「待查證」。",qs:[
  ["小晴說：「這個圖形看起來很整齊，一定是正多邊形。」最適合的回應是？",["同意，看起來就夠了","用直尺和量角器量邊與角，再判斷","看顏色來判斷","問一位同學就好"],1],
  ["向AI提問時，下列哪一種做法最好？",["直接請AI給答案","先寫初稿，再請AI檢查指定的部分","一次問很多題","不看影片直接問"],1],
  ["AI的補充在課本和影片都找不到依據時，應該怎麼做？",["直接抄上去","刪掉自己的答案","標「待查證」，再回看影片或問老師","不理它"],2]]}
];
// 魔法：通過對應的塔後習得；試煉中與試煉場中都可施放
const SPELLS=[
 {name:'直線結界',mage:'線之法師',quiz:'劃去一個錯誤選項',mini:'清除場上所有不符合的圖形或怪物',boss:'角度分類時劃去一個錯誤選項'},
 {name:'數字透視',mage:'數之法師',quiz:'先看見魔法線索',mini:'時序減緩 4 秒',boss:'顯示角度提示'},
 {name:'鏡像護盾',mage:'對稱之法師',quiz:'答錯時，祭壇不會留下殘卷',mini:'擋下下一次碰撞或誤接',boss:'擋下一次答錯的傷害'},
 {name:'幻影分身',mage:'幻影法師',quiz:'更換本題（同塔的另一題）',mini:'短暫無敵 3 秒',boss:'多獲得一顆心'},
 {name:'真相之眼',mage:'證據之法師',quiz:'本題答對額外 +10 魔力',mini:'挑戰成功時額外 +20 魔力',boss:'擊敗魔王時額外 +20 魔力'}
];

function makeTower(t){const rows=[];
 for(let r=0;r<11;r++){let s='';for(let c=0;c<13;c++){let ch='.';
   if(r===0||r===10||c===0||c===12)ch='#';
   else if(r%2===0&&c%2===0&&(r+c+t)%4===0)ch='#';
   s+=ch}rows.push(s)}
 const put=(r,c,ch)=>{rows[r]=rows[r].slice(0,c)+ch+rows[r].slice(c+1)};
 put(1,6,'A');put(10,6,'G');if(MINI_ON[t])put(7,3,'M');return rows}

function drawSprite(c,u,bx,by,rows,pal,dy=0){
 for(let r=0;r<rows.length;r++){const row=rows[r];
   for(let col=0;col<row.length;col++){const ch=row[col];if(ch==='.'||!pal[ch])continue;

 const sx=face==='left'?0:15, stx=face==='left'?0:14;
 R(ctx,U,bx,by,sx,4+dy,1,12,'#b07a4a');

 R(ctx,U,bx,by,stx,0+dy,2,1,'#f2c46b')}
function drawFloor(bx,by,gx,gy,hub,boss){
 R(ctx,U,bx,by,0,0,16,16,boss?'#fbeef2':hub?C.hubFloor:C.towerFloor);
 if(hash(gx,gy,1)>.4)R(ctx,U,bx,by,Math.floor(hash(gx,gy,2)*13)+1,Math.floor(hash(gx,gy,3)*13)+1,1,1,C.speck);
 if(hub){R(ctx,U,bx,by,0,0,16,1,C.seam);R(ctx,U,bx,by,0,0,1,16,C.seam)}
 else{
   if(hash(gx,gy,4)>.92)R(ctx,U,bx,by,8,3,1,4,C.seam);

   if(hash(gx,gy,6)>.97)R(ctx,U,bx,by,7,7,2,2,C.rune);
 }}
function drawWall(bx,by,gx,gy){
 R(ctx,U,bx,by,0,0,16,16,C.wall);
 for(let r=0;r<4;r++){const y=r*4,off=r%2?8:0;
   R(ctx,U,bx,by,0,y,16,1,C.mortar);
   R(ctx,U,bx,by,off,y,1,4,C.mortar);
   R(ctx,U,bx,by,(off+8)%16,y,1,4,C.mortar);
   R(ctx,U,bx,by,off+1,y+1,6,1,C.brick)}
 if(hash(gx,gy,8)>.72)R(ctx,U,bx,by,3,7,10,1,C.inlay);
 if(hash(gx,gy,9)>.9)R(ctx,U,bx,by,7,1,2,2,C.stud)}
function gateState(t){if(t>0&&!towerDone(t-1))return'lock';return towerDone(t)?'done':'open'}

 R(c,u,bx,by,2,1,12,2,C.stone);R(c,u,bx,by,2,3,2,12,C.stone);R(c,u,bx,by,12,3,2,12,C.stone);
 R(c,u,bx,by,4,3,8,12,C.opening);
 if(state!=='lock')R(c,u,bx,by,4,3,8,12,col+'33');
 for(let i=0;i<3;i++){const y=6+i*3;
   if(TRI[t][i])R(c,u,bx,by,5,y,6,1,col);
   else{R(c,u,bx,by,5,y,2,1,col);R(c,u,bx,by,9,y,2,1,col)}}
 R(c,u,bx,by,1,15,14,1,C.stoneD);R(c,u,bx,by,0,15,16,1,C.stoneD)}

function polyPath(c,cx,cy,n,r,rot){c.beginPath();for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n-Math.PI/2;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath()}
function drawAltar(bx,by){

 ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,14+(live?Math.sin(now*3)*1.5:0),0,Math.PI*2);ctx.stroke();
 ctx.lineWidth=1.5;ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(cx,cy,9,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
 if(st==='todo'){for(let k=0;k<3;k++){const a=now*1.5+k*2.1;ctx.fillStyle=C.gold;ctx.fillRect(cx+Math.cos(a)*22-1,cy+Math.sin(a)*22-1,3,3)}}
 ctx.fillStyle=color;ctx.font='bold 12px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.fillText(CN[S.loc],cx,cy+4)}
function drawMiniAltar(bx,by){

 ctx.fillStyle=col;ctx.font='bold 11px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.fillText(done?'✓':'試',cx,cy+4)}

function fresh(){return{score:0,base:0,bonus:0,repair:0,minipts:0,bosspts:0,mp:0,doubleUsed:false,
  boss:{ch:null,built:false,step:1,done:false},
  status:['todo','todo','todo','todo','todo'],remainId:[null,null,null,null,null],
  mini:[false,false,false,false,false],spells:[false,false,false,false,false],
  records:[],awarded:false,coins:0,finished:false,started:new Date().toISOString()}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');
   if(d&&Number.isSafeInteger(d.stars)&&d.run&&Array.isArray(d.run.status)&&d.run.status.length===5){
     const r=d.run;const f=fresh();
     if(!Array.isArray(r.mini))r.mini=f.mini;
     if(!Array.isArray(r.spells))r.spells=f.spells;
     if(typeof r.mp!=='number')r.mp=0;
     if(typeof r.minipts!=='number')r.minipts=0;
     if(typeof r.bosspts!=='number')r.bosspts=0;
     if(!r.boss||typeof r.boss!=='object')r.boss=f.boss;
     return d}}catch(e){}
 return{stars:0,run:fresh(),loc:'hub',x:7,y:7,student:''}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const MG_W=480,MG_H=400;
const rankOf=s=>s>=100?'大法師':s>=60?'正式法師':s>=40?'見習法師':'學徒';
const coinsOf=s=>s>=100?5:s>=80?4:s>=60?3:s>=40?2:1;
function towerDone(i){return S.run.status[i]!=='todo'&&(!MINI_ON[i]||S.run.mini[i])}
function fiveDone(){return TOWERS.every((_,i)=>towerDone(i))}
function allDone(){return fiveDone()&&S.run.boss.done}
function mastery(i){const rs=S.run.records.filter(x=>x.tower===i+1&&x.mode!=='mini');const m=rs.find(x=>x.mode==='main');const rp=rs.some(x=>x.mode==='repair'&&x.ok);
 if(!m)return'未挑戰';if(m.ok)return'✅ 已掌握';if(rp)return'🔁 補練後掌握';return'🌱 需要再複習'}

const ICONS={

function icon(name){const I=ICONS[name];let rects='';
 I.map.forEach((row,r)=>{for(let c=0;c<row.length;c++){const ch=row[c];if(ch!=='.')rects+=`<rect x="${c}" y="${r}" width="1" height="1" fill="${I.pal[ch]}"/>`}});
 return `<svg width="18" height="18" viewBox="0 0 8 8" shape-rendering="crispEdges" style="vertical-align:-3px">${rects}</svg>`}

function msg(t){const m=$('msg');m.textContent=t;m.classList.add('show');clearTimeout(msgT);msgT=setTimeout(()=>m.classList.remove('show'),2800)}
function hud(){const r=S.run;
 $('score').textContent=r.score;$('mp').textContent=r.mp;$('stars').innerHTML=icon('star')+' '+S.stars;$('rank').textContent=rankOf(r.score);
 $('place').textContent=S.loc==='hub'?'◆ 學院中庭':S.loc==='boss'?`◆ 魔王之塔 · ${S.x<6?'組裝之間（破形魔王）':'角度之間（角度魔王）'}`:`◆ 第${S.loc+1}塔 · ${TOWERS[S.loc].name}（${TOWERS[S.loc].mage}）`;
 const doneCount=TOWERS.filter((_,i)=>towerDone(i)).length;
 $('towers').innerHTML=TOWERS.map((T,i)=>{const st=r.status[i];const done=towerDone(i);
   const cls=done?'ok':(st==='remain'?'remain':'todo');
   const lab=done?'已通過':(st==='remain'?'殘卷待補練':st==='todo'?'未攻破':'待完成試煉場');
   return `<div class="trow"><span class="sq ${cls}"></span><span>第${i+1}塔　${esc(T.mage)}</span><span class="tiny">${lab}</span></div>`}).join('')
   +(()=>{const b=r.boss;const lab=b.done?'已擊敗':b.built?'待挑戰角度之間':fiveDone()?'可挑戰':'未解鎖';
     return `<div class="trow"><span class="sq ${b.done?'ok':'remain'}"></span><span>魔王之塔</span><span class="tiny">${lab}</span></div>`})()
   +`<p class="tiny">已通過 ${doneCount} / 5 座塔</p>`;
 $('spells').innerHTML=SPELLS.map((sp,i)=>{const on=r.spells[i];
   return `<div class="spell ${on?'on':''}"><b>${sp.name}</b>　<span class="tiny">${on?'可施放':'通過第'+(i+1)+'塔後習得'}</span><div class="tiny">試煉中：${esc(sp.quiz)}<br>試煉場：${esc(sp.mini)}<br>魔王房：${esc(sp.boss)}</div></div>`}).join('')}
function checkUnlocks(){const r=S.run;const got=[];
 for(let i=0;i<5;i++){if(!r.spells[i]&&towerDone(i)){r.spells[i]=true;got.push(SPELLS[i].name)}}
 if(got.length)msg('習得魔法：'+got.join('、')+'。可在試煉中施放！');
 save();hud()}

function grid(){return S.loc==='hub'?HUB:S.loc==='boss'?BOSSGRID:TGRID[S.loc]}
function isOpen(){return ['modal','mini','boss1','boss2'].some(id=>!$(id).hidden)}
function move(dx,dy){if(titleOpen||isOpen()||Q)return;
 face=dx<0?'left':dx>0?'right':dy<0?'up':'down';
 const g=grid(),nx=S.x+dx,ny=S.y+dy;
 if(ny<0||ny>=g.length||nx<0||nx>=g[0].length)return;
 const ch=g[ny][nx];if(ch==='#')return;
 frame^=1;
 if(S.loc==='hub'&&/[1-5]/.test(ch)){const t=+ch-1;
   if(t>0&&!towerDone(t-1)){msg(`城門封鎖中：需先通過第${t}座塔。`);return}
   S.x=nx;S.y=ny;enterTower(t);return}
 if(S.loc==='hub'&&ch==='X'){S.x=nx;S.y=ny;save();showSummary(false);return}
 if(S.loc==='hub'&&ch==='B'){if(!fiveDone()){msg('魔王之塔被封印：先通過五座塔。');return}
   S.x=nx;S.y=ny;S.loc='boss';S.x=3;S.y=6;save();hud();msg('踏入魔王之塔。左邊是組裝之間，右邊是角度之間。');return}
 if(S.loc==='boss'){
   if(ch==='G'){S.loc='hub';S.x=12;S.y=1;save();hud();msg('回到學院中庭。');return}
   if(ch==='D'&&!S.run.boss.built){msg('角度之間的門被封印：先在組裝之間把三角形組好。');return}
   S.x=nx;S.y=ny;save();hud();
   if(ch==='P')openBoss1();else if(ch==='Q')openBoss2();
   return}

function pickQ(t,mode,exclude){const all=TOWERS[t].qs.map((q,i)=>({q,i,id:t+'-'+i}));
 let pool=all.filter(x=>x.id!==exclude);
 if(mode==='repair')pool=pool.filter(x=>x.id!==S.run.remainId[t]);
 if(!pool.length)pool=all;
 return pool[Math.floor(Math.random()*pool.length)]}
function startQuiz(t,mode){const r=S.run;const p=pickQ(t,mode);
 const resolved=r.status.filter(s=>s!=='todo').length;
 const auto=mode==='main'&&resolved===4&&!r.doubleUsed;
 Q={t,mode,id:p.id,q:p.q,dbl:auto,locked:false,order:shuffle(p.q[1].map((_,i)=>i)),gone:[],used:{},showHint:false,shield:false,eye:false};
 renderQ();$('modal').hidden=false}
function spellBar(){const r=S.run;if(!r.spells.some(Boolean))return'';
 return `<div class="spellbar"><span class="tiny">魔法（${r.mp} MP）</span>${SPELLS.map((sp,i)=>r.spells[i]?
   `<button class="btn sp" ${Q.used[i]||Q.locked||r.mp<SPELL_COST?'disabled':''} onclick="castQuiz(${i})">${sp.name}<small>${SPELL_COST} MP・${esc(sp.quiz)}</small></button>`:'').join('')}</div>`}
function renderQ(){const T=TOWERS[Q.t],q=Q.q,r=S.run;
 const fig=q[3]?`<div class="fig">${SHAPES[q[3]]}</div>`:'';
 let top;
 if(Q.mode==='main'){
   top=`<div class="row"><span class="tiny">四選一 · 選出正確的咒語元素</span>${
     r.doubleUsed?'<span class="badge">魔力爆發卷軸已使用</span>'
     :`<button id="dbl" class="btn ${Q.dbl?'primary':''}" ${Q.locked?'disabled':''} onclick="toggleDbl()">${Q.dbl?'⚡ 本題爆發已啟用':'⚡ 使用魔力爆發卷軸 ×1'}</button>`}</div>`;
   if(Q.showHint)top+=`<div class="hint">魔法線索：${esc(T.hint)}</div>`;
 }else{
   top=`<div class="hint">殘卷補練・魔法線索：${esc(T.hint)}</div>`;
 }
 const opts=Q.order.map((oi,pos)=>{const gone=Q.gone.includes(oi);
   return `<button class="opt ${gone?'gone':''}" data-o="${oi}" ${gone?'disabled':''} onclick="answer(${oi})"><span class="lt">${'ABCD'[pos]}</span>${esc(Q.q[1][oi])}</button>`}).join('');
 $('box').innerHTML=`<div class="qtop"><canvas class="pt" width="80" height="80" data-t="${Q.t}"></canvas>
  <div><div class="bars"><span></span><span class="n"></span><span></span></div>

  ${top}${spellBar()}${fig}<h2>${esc(q[0])}</h2><div class="opts">${opts}</div><div id="fb" aria-live="polite"></div>`;
 document.querySelectorAll('canvas.pt').forEach(c=>drawPortrait(c,+c.dataset.t))}
function toggleDbl(){if(!Q||Q.locked||S.run.doubleUsed)return;Q.dbl=!Q.dbl;renderQ()}
function castQuiz(i){const r=S.run;
 if(!Q||Q.locked||Q.used[i]||!r.spells[i]||r.mp<SPELL_COST)return;
 r.mp-=SPELL_COST;Q.used[i]=true;
 if(i===0){const wrong=Q.order.filter(oi=>oi!==Q.q[2]&&!Q.gone.includes(oi));
   if(wrong.length)Q.gone.push(wrong[Math.floor(Math.random()*wrong.length)]);msg('直線結界劃去了一個錯誤選項。')}
 if(i===1){Q.showHint=true;msg('數字透視：魔法線索已顯現。')}
 if(i===2){Q.shield=true;msg('鏡像護盾已展開。')}
 if(i===3){const p=pickQ(Q.t,Q.mode,Q.id);Q.id=p.id;Q.q=p.q;Q.order=shuffle(p.q[1].map((_,k)=>k));Q.gone=[];msg('幻影分身：題目已更換。')}
 if(i===4){Q.eye=true;msg('真相之眼：本題答對將額外獲得 10 魔力。')}
 save();hud();renderQ()}
function answer(oi){if(!Q||Q.locked)return;Q.locked=true;
 const r=S.run,t=Q.t,T=TOWERS[t],ok=oi===Q.q[2];let pts=0,blocked=false;
 if(Q.mode==='main'){
   pts=ok?(Q.dbl?40:20):0;r.score+=pts;if(ok)r.base+=20;if(ok&&Q.dbl)r.bonus+=20;
   if(ok&&Q.eye){pts+=10;r.score+=10;r.bonus+=10}
   if(Q.dbl)r.doubleUsed=true;
   if(ok){r.status[t]='clear';r.mp+=10}
   else if(Q.shield){blocked=true}
   else{r.status[t]='remain';r.remainId[t]=Q.id}
 }else{
   if(ok){pts=10;r.score+=10;r.repair+=10;r.status[t]='done';r.mp+=5}
 }
 r.records.push({time:new Date().toISOString(),student:S.student||'',tower:t+1,tower_name:T.name,mage:T.mage,
   mode:Q.mode,question_id:Q.id,question:Q.q[0],options:Q.q[1].join(' | '),chosen:Q.q[1][oi],correct_answer:Q.q[1][Q.q[2]],
   ok,double:!!(Q.dbl&&Q.mode==='main'),points:pts});
 document.querySelectorAll('#box .opt').forEach(b=>{b.disabled=true;const o=+b.dataset.o;

   :(ok?'殘卷補練成功，魔力回收！':'還不夠穩，殘卷仍留在祭壇上。');
 $('fb').innerHTML=`<div class="feedback ${ok?'ok':'no'}"><b>${head}</b>${pts?`<br>魔力 +${pts}`:''}${ok?'<br>法力 +'+(Q.mode==='main'?10:5):''}<br>正確元素：${esc(Q.q[1][Q.q[2]])}<br>${esc(T.hint)}</div>
  <button class="btn primary" onclick="closeQuiz()">繼續前進 →</button>`;
 $('score').textContent=r.score;$('mp').textContent=r.mp;save()}

function miniStep(dt){const g=MG;const f=g.slowT>0?0.5:1;
 if(g.slowT>0)g.slowT-=dt;if(g.inv>0)g.inv-=dt;
 g.time+=dt;
 g.px=Math.max(24,Math.min(MG_W-24,g.px+g.dir*260*dt));
 g.spawnT-=dt;

   if(g.kind==='rain'){
     let n=3+Math.floor(Math.random()*4);if(Math.random()<.4)n=g.target;
     g.items.push({x:30+Math.random()*(MG_W-60),y:-20,n,ok:n===g.target,vy:80+g.time*3});
     g.spawnT=Math.max(.45,.9-g.time*.01);
   }else{
     const safe=['square','tri','hex','rect'];

 const py=MG_H-48;
 g.items.forEach(it=>{it.y+=it.vy*dt*f});

   if(g.kind==='rain'){
     if(it.y>MG_H-100&&it.y<MG_H-30&&Math.abs(it.x-g.px)<36){

       return false}

   else{

     return it.y<MG_H+40}
 });
 if(g.kind==='rain'&&g.score>=8){endMini(true);return}

 if(win){r.mini[t]=true;r.score+=pts;r.minipts+=pts;r.mp+=10}

const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function newChallenge(){
 const pool=TRI_TYPES.map((_,i)=>i).filter(i=>i!==S.lastBossType);
 const ti=pool[Math.floor(Math.random()*pool.length)],T=TRI_TYPES[ti];
 const L=T.L[Math.floor(Math.random()*T.L.length)];
 const mx=Math.max(...T.ang.map(a=>Math.sin(a*DEG)));
 const sides=T.ang.map(a=>Math.round(L*Math.sin(a*DEG)/mx*10)/10);   // sides[i] 是 ∠i 的對邊
 S.lastBossType=ti;
 return{ti,type:T.type,ang:T.ang.slice(),L,sides,hidden:Math.floor(Math.random()*3)}}
function exactSides(ch){const mx=Math.max(...ch.ang.map(a=>Math.sin(a*DEG)));return ch.ang.map(a=>ch.L*Math.sin(a*DEG)/mx)}
function canonPts(ch){const e=exactSides(ch),A=ch.ang[0]*DEG;
 const p=[{x:0,y:0},{x:e[2],y:0},{x:e[1]*Math.cos(A),y:-e[1]*Math.sin(A)}];
 const xs=p.map(q=>q.x),ys=p.map(q=>q.y),minx=Math.min(...xs),miny=Math.min(...ys);
 const w=Math.max(...xs)-minx,h=Math.max(...ys)-miny,s=Math.min(320/w,240/h,70);
 const ox=BW/2-(minx+w/2)*s,oy=BH/2+20-(miny+h/2)*s;
 return p.map(q=>({x:q.x*s+ox,y:q.y*s+oy}))}
const classify=ch=>{const m=Math.max(...ch.ang);return m>90?'鈍角三角形':m===90?'直角三角形':'銳角三角形'};
function gridBg(c){c.fillStyle='#fbf9ff';c.fillRect(0,0,BW,BH);
 c.strokeStyle='rgba(122,92,214,.12)';c.lineWidth=1;
 for(let x=0;x<=BW;x+=BU){c.beginPath();c.moveTo(x+.5,0);c.lineTo(x+.5,BH);c.stroke()}
 for(let y=0;y<=BH;y+=BU){c.beginPath();c.moveTo(0,y+.5);c.lineTo(BW,y+.5);c.stroke()}
 c.fillStyle='rgba(122,92,214,.35)';for(let x=0;x<=BW;x+=BU)for(let y=0;y<=BH;y+=BU)c.fillRect(x-1,y-1,3,3)}
function triPath(c,p){c.beginPath();c.moveTo(p[0].x,p[0].y);c.lineTo(p[1].x,p[1].y);c.lineTo(p[2].x,p[2].y);c.closePath()}
function label(c,text,x,y,col,bg){c.font='bold 15px "Noto Sans TC",sans-serif';c.textAlign='center';
 const w=c.measureText(text).width+10;c.fillStyle=bg||'rgba(255,255,255,.9)';c.fillRect(x-w/2,y-12,w,22);c.fillStyle=col;c.fillText(text,x,y+4)}
// 角弧：prog[i] 為 0–1 的繪製進度；hidden 的角顯示「?」，solved 後顯示綠色度數
function drawAngles(c,p,ch,prog,solved,now){
 for(let i=0;i<3;i++){const g=prog[i];if(g<=0)continue;
   const V=p[i],P=p[(i+1)%3],Q=p[(i+2)%3];
   const a1=Math.atan2(P.y-V.y,P.x-V.x),a2=Math.atan2(Q.y-V.y,Q.x-V.x);
   let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
   const hid=i===ch.hidden,ask=hid&&!solved;
   const col=ask?'#d6566e':(hid?C.mintD:C.violetD);
   c.strokeStyle=col;c.lineWidth=3;
   if(ch.ang[i]===90&&!ask){const l1=Math.hypot(P.x-V.x,P.y-V.y),l2=Math.hypot(Q.x-V.x,Q.y-V.y);
     const u1={x:(P.x-V.x)/l1,y:(P.y-V.y)/l1},u2={x:(Q.x-V.x)/l2,y:(Q.y-V.y)/l2},k=16*g;
     c.beginPath();c.moveTo(V.x+u1.x*k,V.y+u1.y*k);c.lineTo(V.x+(u1.x+u2.x)*k,V.y+(u1.y+u2.y)*k);c.lineTo(V.x+u2.x*k,V.y+u2.y*k);c.stroke()}
   else{const r=ch.ang[i]<35?36:24;c.beginPath();c.arc(V.x,V.y,r,a1,a1+d*g,d<0);c.stroke()}
   if(g>=1){const bis=a1+d/2,lr=ch.ang[i]<35?62:50;const lx=V.x+Math.cos(bis)*lr,ly=V.y+Math.sin(bis)*lr;
     if(ask){const s=1+.15*Math.sin(now*6);c.save();c.translate(lx,ly);c.scale(s,s);label(c,'?',0,0,'#fff','#d6566e');c.restore()}
     else label(c,ch.ang[i]+'°',lx,ly,col)}
 }}
function vertexLabels(c,p){const cx=(p[0].x+p[1].x+p[2].x)/3,cy=(p[0].y+p[1].y+p[2].y)/3;
 p.forEach((q,i)=>{const dx=q.x-cx,dy=q.y-cy,l=Math.hypot(dx,dy)||1;
   c.fillStyle=C.ink;c.font='bold 16px "Noto Sans TC",sans-serif';c.textAlign='center';c.fillText(VN[i],q.x+dx/l*20,q.y+dy/l*20+6)})}
function confetti(n){const a=[];for(let k=0;k<n;k++)a.push({x:BW/2,y:BH/2,vx:(Math.random()-.5)*420,vy:-Math.random()*380-60,c:[C.gold,C.mint,C.violet,'#ff9fc2','#ffe08a'][k%5],s:4+Math.floor(Math.random()*4)});return a}
function drawConfetti(c,parts,el){const t=Math.min(el,2);parts.forEach(q=>{c.fillStyle=q.c;c.fillRect(q.x+q.vx*t,q.y+q.vy*t+190*t*t,q.s,q.s)})}
function banner(c,title,sub,ok,el){const bw=360,bh=sub?88:64,bx=(BW-bw)/2,by=BH/2-bh/2-10+(el<.3?(1-el/.3)*-30:0);
 c.fillStyle=ok?'#fff8e6':'#fdf0f2';c.fillRect(bx,by,bw,bh);c.strokeStyle=ok?C.gold:'#d07a8c';c.lineWidth=4;c.strokeRect(bx+2,by+2,bw-4,bh-4);
 c.fillStyle=ok?C.mintD:'#b5523b';c.font='bold 28px "Noto Sans TC",sans-serif';c.textAlign='center';c.fillText(title,BW/2,by+44);
 if(sub){c.fillStyle=C.violetD;c.font='bold 15px "Noto Sans TC",sans-serif';c.fillText(sub,BW/2,by+72)}}

// ===== 房間一：組裝之間 =====
let B1=null;
const b1c=$('b1c');
function b1Fresh(){return[{x:3,y:8.5},{x:5,y:8.5},{x:4,y:7}]}
function openBoss1(){const b=S.run.boss;
 if(b.built){msg('三角形已經組好了，往右走，前往角度之間。');return}
 if(!b.ch){b.ch=newChallenge();save()}
 B1={pts:b1Fresh(),drag:-1,phase:'build',t0:0,resets:0,id:Date.now(),from:null,to:null,parts:[]};
 $('b1goal').innerHTML=`<h2>做出一個 ${esc(b.ch.type)}</h2>`;
 $('b1ctl').hidden=false;$('b1res').hidden=true;$('b1res').innerHTML='';
 $('boss1').hidden=false;b1Chips();b1Loop(B1.id)}
function b1Reset(){if(!B1||B1.phase!=='build')return;B1.pts=b1Fresh();B1.resets++;b1Chips()}
function b1Sides(){const p=B1.pts;return[dist(p[1],p[2]),dist(p[2],p[0]),dist(p[0],p[1])]}   // 對邊：BC、CA、AB
function b1Match(){const tg=S.run.boss.ch.sides,used=[false,false,false];
 const s=b1Sides();const ok=s.map(v=>{for(let i=0;i<3;i++)if(!used[i]&&Math.abs(v-tg[i])<=TOL){used[i]=true;return true}return false});
 return{s,ok,used}}
function b1Area(){const p=B1.pts;return Math.abs((p[1].x-p[0].x)*(p[2].y-p[0].y)-(p[2].x-p[0].x)*(p[1].y-p[0].y))/2}
function b1Chips(){const m=b1Match();$('b1chips').innerHTML=S.run.boss.ch.sides.map((v,i)=>`<span class="chip2 ${m.used[i]?'on':''}">${v.toFixed(1)}</span>`).join('')}
function cPos(cv,e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)}}
b1c.addEventListener('pointerdown',e=>{if(!B1||B1.phase!=='build')return;const p=cPos(b1c,e);let best=-1,bd=28;
 B1.pts.forEach((q,i)=>{const d=Math.hypot(q.x*BU-p.x,q.y*BU-p.y);if(d<bd){bd=d;best=i}});
 if(best>=0){B1.drag=best;b1c.setPointerCapture(e.pointerId);e.preventDefault()}});
b1c.addEventListener('pointermove',e=>{if(!B1||B1.drag<0)return;const p=cPos(b1c,e);
 B1.pts[B1.drag]={x:Math.round(clamp(p.x/BU,.3,BW/BU-.3)*10)/10,y:Math.round(clamp(p.y/BU,.3,BH/BU-.3)*10)/10};b1Chips()});
function b1Up(){if(!B1||B1.drag<0)return;B1.drag=-1;const m=b1Match();if(m.ok.every(Boolean)&&b1Area()>.5)b1Success()}
['pointerup','pointercancel'].forEach(ev=>b1c.addEventListener(ev,b1Up));
function b1Success(){const b=S.run.boss,r=S.run,e=exactSides(b.ch);
 // 找出學生頂點與標準頂點的最佳對應
 const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];let best=perms[0],be=1e9;
 perms.forEach(p=>{let err=0;for(let i=0;i<3;i++)err+=Math.abs(dist(B1.pts[p[(i+1)%3]],B1.pts[p[(i+2)%3]])-e[i]);if(err<be){be=err;best=p}});
 B1.from=best.map(si=>({x:B1.pts[si].x*BU,y:B1.pts[si].y*BU}));B1.to=canonPts(b.ch);
 B1.phase='anim';B1.t0=performance.now();B1.parts=confetti(40);
 const s=b1Sides().map(v=>v.toFixed(1));
 b.built=true;r.score+=30;r.bosspts+=30;r.mp+=10;
 r.records.push({time:new Date().toISOString(),student:S.student||'',tower:6,tower_name:'魔王之塔・組裝之間',mage:'破形魔王',mode:'boss1',
   question_id:'boss1-'+b.ch.ti,question:`組裝${b.ch.type}（邊長 ${b.ch.sides.join('、')}）`,options:'',
   chosen:`組出邊長 ${s.join('、')}（重新擺放 ${B1.resets} 次）`,correct_answer:b.ch.sides.join('、'),ok:true,double:false,points:30});
 $('b1ctl').hidden=true;save();hud()}
function b1Loop(id){if(!B1||B1.id!==id)return;b1Draw();requestAnimationFrame(()=>b1Loop(id))}
function b1Draw(){const c=b1c.getContext('2d'),now=performance.now()/1000;gridBg(c);
 if(B1.phase==='build'){
   const p=B1.pts.map(q=>({x:q.x*BU,y:q.y*BU})),m=b1Match();
   triPath(c,p);c.fillStyle='rgba(243,210,122,.22)';c.fill();
   const cx=(p[0].x+p[1].x+p[2].x)/3,cy=(p[0].y+p[1].y+p[2].y)/3;
   for(let i=0;i<3;i++){const P=p[(i+1)%3],Q=p[(i+2)%3];
     c.strokeStyle=m.ok[i]?C.mint:C.violet;c.lineWidth=m.ok[i]?6:4;c.beginPath();c.moveTo(P.x,P.y);c.lineTo(Q.x,Q.y);c.stroke();
     const mx=(P.x+Q.x)/2,my=(P.y+Q.y)/2,dx=mx-cx,dy=my-cy,l=Math.hypot(dx,dy)||1;
     label(c,m.s[i].toFixed(1),mx+dx/l*18,my+dy/l*18,m.ok[i]?C.mintD:C.violetD)}
   p.forEach((q,i)=>{c.fillStyle=B1.drag===i?C.gold:C.violet;c.beginPath();c.arc(q.x,q.y,14,0,Math.PI*2);c.fill();
     c.strokeStyle='#fff';c.lineWidth=3;c.stroke();c.fillStyle='#fff';c.font='bold 14px sans-serif';c.textAlign='center';c.fillText(VN[i],q.x,q.y+5)});
   drawBossSprite(c,3,BW-60,8);
   return}
 // 組裝完成的動畫
 const t=(performance.now()-B1.t0)/1000,ch=S.run.boss.ch;
 const k=ease(clamp((t-.6)/1,0,1));
 const p=B1.from.map((f,i)=>({x:f.x+(B1.to[i].x-f.x)*k,y:f.y+(B1.to[i].y-f.y)*k}));
 if(t<1.6){c.fillStyle=`rgba(243,210,122,${.15+.12*Math.sin(t*12)})`;c.fillRect(0,0,BW,BH)}
 triPath(c,p);c.fillStyle=`rgba(243,210,122,${t<.6?.3+.3*Math.sin(t*14):.35})`;c.fill();
 c.strokeStyle=C.gold;c.lineWidth=5;triPath(c,p);c.stroke();
 if(t<1.6)for(let s=0;s<14;s++){const a=s/14*Math.PI*2+t*3,R0=40+t*90;c.fillStyle=s%2?C.gold:'#fff3b0';
   c.fillRect(BW/2+Math.cos(a)*R0-2,BH/2+Math.sin(a)*R0-2,4,4)}
 if(t>1.6){drawAngles(c,p,ch,[0,1,2].map(i=>clamp((t-1.6-i*.4)/.4,0,1)),false,now);vertexLabels(c,p)}
 if(t>3){const el=t-3;drawConfetti(c,B1.parts,el);banner(c,'形狀化為角度謎題！','前往右邊的角度之間，挑戰角度魔王',true,el);
   if(B1.phase!=='done'){B1.phase='done';$('b1res').hidden=false;
     $('b1res').innerHTML=`<div class="bigres ok">組裝成功！</div><p>魔力 +30，法力 +10。角度之間的門已經打開。</p><button class="btn primary" onclick="closeBoss1()">前往角度之間</button>`}}}
function closeBoss1(){const built=S.run.boss.built;$('boss1').hidden=true;B1=null;save();hud();
 if(built)msg('角度之間的門打開了！往右走，找角度魔王。')}

let B2=null;
const b2c=$('b2c');
function openBoss2(){const b=S.run.boss;
 if(!b.built){msg('先在左邊的組裝之間把三角形組好。');return}
 if(b.done){msg('角度魔王已經被擊敗了。');return}
 B2={hearts:3,used:{},hint:false,shield:false,eye:false,gone:[],phase:'q',t0:0,hitT:-9,id:Date.now(),parts:[]};
 $('b2fb').innerHTML='';$('boss2').hidden=false;b2Render();b2Loop(B2.id)}
function b2Known(ch){return[0,1,2].filter(i=>i!==ch.hidden)}

 $('b2hearts').textContent='生命 '+'♥'.repeat(Math.max(0,B2.hearts));

 $('b2ctl').hidden=false;

   ${B2.hint?'<div class="hint">魔法線索：三角形三個內角的和是 180°。</div>':''}
   <div class="row" style="justify-content:flex-start"><span>∠${VN[h]} =</span><input id="b2in" class="numin" inputmode="numeric" maxlength="3" placeholder="?" onkeydown="if(event.key==='Enter')b2Submit()"><span>度</span><button class="btn primary" onclick="b2Submit()">施放答案</button></div>`;
 }else{

   <div class="opts">${CLS.map((t,k)=>{const g=B2.gone.includes(k);return `<button class="opt ${g?'gone':''}" ${g?'disabled':''} onclick="b2Choose(${k})"><span class="lt">${'ABC'[k]}</span>${t}</button>`}).join('')}</div>`;
 }
 $('b2q').innerHTML=html;
 $('b2spells').innerHTML=r.spells.some(Boolean)?`<span class="tiny">魔法（${r.mp} MP）</span>`+SPELLS.map((sp,i)=>{if(!r.spells[i])return'';
   const off=B2.used[i]||r.mp<SPELL_COST||(i===0&&b.step===1);
   return `<button class="btn sp" ${off?'disabled':''} onclick="castBoss(${i})">${sp.name}<small>${SPELL_COST} MP・${esc(sp.boss)}</small></button>`}).join(''):'';
 const inp=$('b2in');if(inp)inp.focus()}
function castBoss(i){const r=S.run,b=r.boss;
 if(!B2||B2.phase!=='q'||B2.used[i]||!r.spells[i]||r.mp<SPELL_COST)return;
 if(i===0&&b.step===1)return;
 r.mp-=SPELL_COST;B2.used[i]=true;
 if(i===0){const right=CLS.indexOf(classify(b.ch));const wrong=[0,1,2].filter(k=>k!==right&&!B2.gone.includes(k));
   if(wrong.length)B2.gone.push(wrong[Math.floor(Math.random()*wrong.length)]);msg('直線結界劃去了一個錯誤選項。')}

 save();hud();b2Render()}

function showSummary(final){const r=S.run;
 const rows=TOWERS.map((T,i)=>{const m=mastery(i);const mini=MINI_ON[i]?(r.mini[i]?'✅ 過關':'🔒 未完成'):'—';
   return `<tr><td>${i+1}. ${esc(T.mage)}（${esc(T.name)}）</td><td>${m}</td><td>${mini}</td></tr>`}).join('')
   +`<tr><td>魔王之塔${r.boss.ch?'（'+esc(r.boss.ch.type)+'）':''}</td><td>${r.boss.built?'✅ 組裝完成':'🔒 未組裝'}</td><td>${r.boss.done?'✅ 擊敗角度魔王':'🔒 未擊敗'}</td></tr>`;
 const wrong=r.records.filter(x=>x.mode==='main'&&!x.ok).map(x=>`<div class="feedback no"><b>${esc(x.question)}</b><br>你施放的元素：${esc(x.chosen)}<br>正確元素：${esc(x.correct_answer)}</div>`).join('');
 const stars=r.awarded?`<p>本次試煉獲得 ${r.coins} 顆魔法星晶，目前共有 ${S.stars} 顆。</p>`:(final?'':'<p class="tiny">通過五座塔後會結算星晶。</p>');
 const fb=final?`<h3>出口回饋（法師誓言）</h3><p>用自己的話說說：怎麼判斷一個圖形是不是正多邊形？</p><textarea placeholder="我會先＿＿，再＿＿，所以＿＿。"></textarea><p class="tiny">寫在學習單或說給老師聽（此欄不會儲存）。</p>`:'';
 $('box').innerHTML=`<div class="sum"><span class="tag">${final?'徽章鑄成':'紀錄之碑'}</span> <span class="tiny">${esc(S.student||'未填寫')}</span>
  <h1>${r.score}<small> 分</small></h1><p>${rankOf(r.score)}　基本魔力 ${r.base} ＋ 爆發加成 ${r.bonus} ＋ 殘卷補練 ${r.repair} ＋ 試煉場 ${r.minipts} ＋ 魔王之塔 ${r.bosspts}</p>
  ${stars}<h3>五位法師的掌握表</h3><table><tr><th>守塔法師（塔）</th><th>祭壇試煉／組裝之間</th><th>試煉場／角度之間</th></tr>${rows}</table>
  ${wrong}${fb}
  <div class="btns"><button class="btn" onclick="exportJSON()">匯出 JSON</button><button class="btn" onclick="exportCSV()">匯出 CSV</button><button class="btn" onclick="closeModal()">${final?'回學院中庭':'關閉'}</button><button class="btn" onclick="confirmReset()">再闖一次</button></div></div>`;
 $('modal').hidden=false}
function closeModal(){$('modal').hidden=true}
function confirmReset(){if(!confirm('重新開始本次試煉？魔法星晶會保留。'))return;
 S.run=fresh();S.loc='hub';S.x=7;S.y=7;Q=null;MG=null;B1=null;B2=null;
 ['modal','mini','boss1','boss2'].forEach(id=>$(id).hidden=true);save();hud();msg('新的試煉開始了。走向上方的塔門，依序踏入第一座塔。')}
function fname(ext){const who=(S.student||'anon').replace(/[^\w一-鿿-]/g,'_');return `polygon-magic-${who}-${new Date().toISOString().slice(0,10)}.${ext}`}
function download(name,type,text,bom){const blob=new Blob([(bom?'﻿':'')+text],{type});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function exportJSON(){const r=S.run;
 const data={app:'多邊形魔法學院・象數試煉',exportedAt:new Date().toISOString(),student:S.student||null,
  run:{started:r.started,finished:!!r.finished,score:r.score,base:r.base,bonus:r.bonus,repair:r.repair,minipts:r.minipts,mp:r.mp,stars_earned:r.coins||0,
   towers:TOWERS.map((T,i)=>({tower:i+1,name:T.name,mage:T.mage,status:r.status[i],mastery:mastery(i),
     mini_cleared:MINI_ON[i]?!!r.mini[i]:null,passed:towerDone(i)})),
   spells_unlocked:SPELLS.filter((_,i)=>r.spells[i]).map(s=>s.name),
   bosspts:r.bosspts,
   boss:r.boss.ch?{triangle_type:r.boss.ch.type,target_sides:r.boss.ch.sides,angles:{A:r.boss.ch.ang[0],B:r.boss.ch.ang[1],C:r.boss.ch.ang[2]},
     hidden_vertex:VN[r.boss.ch.hidden],built:r.boss.built,angle_step:r.boss.step,defeated:r.boss.done}:{built:false,defeated:false}},
  records:r.records};
 download(fname('json'),'application/json',JSON.stringify(data,null,2),false)}
function exportCSV(){const cols=['time','student','tower','tower_name','mage','mode','question_id','question','options','chosen','correct_answer','ok','double','points'];
 const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const lines=[cols.join(',')].concat(S.run.records.map(x=>cols.map(c=>q(c==='ok'||c==='double'?(x[c]?1:0):x[c])).join(',')));
 download(fname('csv'),'text/csv',lines.join('\r\n'),true)}

// ===== 守塔法師立繪 =====
function drawPortrait(cv,t){const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
 c.fillStyle='#f4efff';c.fillRect(0,0,80,80);
 c.strokeStyle='rgba(217,161,58,.45)';c.lineWidth=1;c.beginPath();c.arc(40,40,34,0,Math.PI*2);c.stroke();
 c.beginPath();c.arc(40,40,26,0,Math.PI*2);c.stroke();
 const pal={...MAGE_PAL,...PORT[t]};
 if(t===3){c.globalAlpha=.28;drawSprite(c,5,-10,6,MAGE_ROWS,pal);c.globalAlpha=1}
 drawSprite(c,5,0,0,MAGE_ROWS,pal);
 if(t===0){R(c,5,0,0,14,5,1,10,'#9aa0b8');for(let k=0;k<4;k++)R(c,5,0,0,13,6+k*2,1,1,C.ink)}
 if(t===1){c.fillStyle=C.gold;c.font='bold 13px sans-serif';c.textAlign='center';c.fillText('3',10,18);c.fillText('6',68,26);R(c,5,0,0,1,10,2,2,'#f2c46b')}
 if(t===2){R(c,5,0,0,2,9,12,1,'#8fc9cf');R(c,5,0,0,1,10,3,1,'#8fc9cf');R(c,5,0,0,12,10,3,1,'#8fc9cf');R(c,5,0,0,7,5,2,5,'#8fc9cf')}
 if(t===3){R(c,5,0,0,0,9,2,6,'rgba(154,108,240,.45)');R(c,5,0,0,14,9,2,6,'rgba(154,108,240,.45)')}
 if(t===4){R(c,5,0,0,11,10,4,3,'#fff8e6');R(c,5,0,0,11,10,1,3,'#8a5a1e');R(c,5,0,0,1,1,2,2,'#f2c46b')}}

// ===== 遊戲畫面 =====
const cv=$('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
function drawGame(){const g=grid();const W=g[0].length*TS,H=g.length*TS;
 if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false}
 ctx.fillStyle='#fbf9ff';ctx.fillRect(0,0,W,H);
 if(S.loc==='hub'){ctx.save();ctx.translate(7*TS+TS/2,4*TS+TS/2);ctx.strokeStyle='rgba(122,92,214,.22)';ctx.lineWidth=1.5;ctx.setLineDash([2,6]);
   [96,144].forEach(r=>{ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke()});
   ctx.setLineDash([]);for(let k=0;k<8;k++){ctx.save();ctx.rotate(k*Math.PI/4);ctx.fillStyle='rgba(217,161,58,.35)';ctx.fillRect(100,-1,40,2);ctx.restore()}
   ctx.restore()}
 for(let y=0;y<g.length;y++)for(let x=0;x<g[0].length;x++){const ch=g[y][x],bx=x*TS,by=y*TS;
   if(ch==='#')drawWall(bx,by,x,y);else drawFloor(bx,by,x,y,S.loc==='hub',S.loc==='boss');
   if(S.loc==='hub'&&/[1-5]/.test(ch))drawGateTile(bx,by,+ch-1);
   else if(ch==='B')drawBossGate(bx,by);
   else if(ch==='P'||ch==='Q')drawBossAltar(bx,by,ch);
   else if(ch==='D')drawBossDoor(bx,by);
   else if(ch==='X')drawStele(bx,by);
   else if(ch==='G')drawDoor(bx,by);
   else if(ch==='A')drawAltar(bx,by);
   else if(ch==='M')drawMiniAltar(bx,by);
 }
 drawMageWorld(S.x*TS,S.y*TS)}

// ===== 標題畫面 =====
const tc=$('tc'),tx=tc.getContext('2d');tx.imageSmoothingEnabled=false;
function drawTitle(){const W=720,H=400,now=performance.now()/1000;
 tx.fillStyle='#fdfbff';tx.fillRect(0,0,W,H);
 for(let i=0;i<10;i++){tx.fillStyle=`rgba(190,170,240,${0.06+i*0.012})`;tx.fillRect(0,i*40,W,40)}
 for(let i=0;i<80;i++){const x=Math.floor(hash(i,1,11)*W),y=Math.floor(hash(i,2,12)*250);const a=.5+.4*Math.sin(now*2+i);
   tx.fillStyle=`rgba(217,161,58,${Math.max(.2,a)})`;tx.fillRect(x,y,2,2)}
 tx.fillStyle='#ffe9a8';tx.beginPath();tx.arc(620,70,26,0,Math.PI*2);tx.fill();
 for(let i=0;i<7;i++){const w=96-i*10,h=34,x=360-w/2,y=340-(i+1)*h;
   tx.fillStyle='#e6dcf9';tx.fillRect(x,y,w,h);
   tx.strokeStyle=C.violet;tx.lineWidth=2;tx.strokeRect(x+1,y+1,w-2,h-2);
   if(i%2===0){tx.fillStyle='rgba(217,161,58,'+(0.6+0.25*Math.sin(now*2+i))+')';tx.fillRect(360-3,y+10,6,12)}}
 tx.fillStyle=C.gold;tx.fillRect(357,30,6,30);tx.fillRect(352,46,16,4);
 tx.fillStyle='#ece6f8';tx.fillRect(0,350,W,50);
 for(let i=0;i<5;i++){drawGateAt(tx,160+i*90,300,4,i,'open')}
 drawSprite(tx,5,60,240,MAGE_ROWS,MAGE_PAL,0);
 tx.fillStyle=C.gold;tx.fillRect(130,244,10,10);
 for(let i=0;i<3;i++){const x=600,y=150+i*18;tx.fillStyle='rgba(122,92,214,.6)';
   if(TRI[i+1][0]){tx.fillRect(x,y,30,3)}else{tx.fillRect(x,y,12,3);tx.fillRect(x+18,y,12,3)}}}

// ===== 輸入 =====
const KEYS={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
document.addEventListener('keydown',e=>{if(titleOpen)return;if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
 const k=(e.key||'').toLowerCase();
 if(!$('mini').hidden){
   if(k==='arrowleft'||k==='a'){e.preventDefault();if(MG)MG.dir=-1}
   else if(k==='arrowright'||k==='d'){e.preventDefault();if(MG)MG.dir=1}
   else if(k===' '&&MG&&MG.phase==='ready'){e.preventDefault();miniStart()}
   return}
 const d=KEYS[k];if(!d)return;e.preventDefault();move(d[0],d[1])});
document.addEventListener('keyup',e=>{const k=(e.key||'').toLowerCase();if(MG&&['arrowleft','a','arrowright','d'].includes(k))MG.dir=0});
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('click',()=>move(+b.dataset.dx,+b.dataset.dy)));
$('student').value=S.student||'';
$('student').addEventListener('change',e=>{S.student=e.target.value.trim();save()});
function startGame(){titleOpen=false;$('title').hidden=true;
 if(S.run.records.length===0&&S.loc==='hub')msg('你站在學院中庭。走向上方的塔門，依序踏入第一座塔。')}
const hasSave=S.run.records.length>0||S.loc!=='hub'||S.x!==7||S.y!==7;
$('btnStart').textContent=hasSave?'繼續冒險':'開始冒險';

// ===== 啟動 =====
hud();
function loop(){if(titleOpen)drawTitle();else drawGame();requestAnimationFrame(loop)}
loop();
</script>
